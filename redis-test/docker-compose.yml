services:

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    ports:
      - "8000:8000"
    depends_on:
      - redis

  subscriber:
    build:
      context: .
      dockerfile: Dockerfile.subscriber
    depends_on:
      - redis